name: Set up dependencies for tasks

inputs:
  include_uv:
    description: "Setup uv and a python venv"
    type: string
    required: false
    default: "yes"
  python_version:
    description: "Python version to use with uv."
    required: false
    default: "3.12"
    type: string
  include_maturin:
    description: "Setup Maturin"
    type: string
    required: false
    default: "yes"
  include_node:
    description: "Install node, bun etc.."
    type: string
    required: false
    default: "no"
  include_just:
    description: "Install the just task runner."
    type: string
    required: false
    default: "yes"

runs:
  using: "composite"
  steps:
    - name: Set up maturin
      if: inputs.include_maturin == 'yes'
      uses: PyO3/maturin-action@v1
      with:
        working-directory: tierkreis/

    - name: Set up uv & venv
      if: inputs.include_uv == 'yes'
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.13.4"
        enable-cache: true
        cache-suffix: ${{ inputs.python_version }}
        python-version: ${{ inputs.python_version }}
        cache-dependency-glob: uv.lock        

    - name: Set up just
      if: inputs.include_just == 'yes'
      uses: extractions/setup-just@v4

    - name: Set up pnpm
      if: inputs.include_node == 'yes'
      uses: pnpm/action-setup@v4
      with:
        run_install: false
        version: 11.8.0

    - name: Set up node
      uses: actions/setup-node@v5
      if: inputs.include_node == 'yes'
      with:
        node-version: "24.8.0"
        cache: "pnpm"
        cache-dependency-path: tierkreis/frontend/pnpm-lock.yaml
        package-manager-cache: false
