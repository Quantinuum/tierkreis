name: Reusable setup for command

on:
  workflow_call:
    inputs:
      command_name:
        required: true
        type: string
      command:
        required: true
        type: string
      save_cache:
        description: Save compiled artifacts to the shared Kache cache
        required: false
        default: true
        type: boolean

jobs:
  run:
    name: ${{ inputs.command_name }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kache
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: tierkreis-dev
          cache-executables: true
          max-size: 5GiB
          save-cache: ${{ inputs.save_cache }}

      - name: Setup deps
        uses: ./.github/actions/setup_deps
        with:
          python_version: ${{ matrix.python-version }}

      - name: ${{ inputs.command_name }}
        run: ${{ inputs.command }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ inputs.command_name }}
          path: /tmp/sphinx-err-*.log
