name: UV Audit

permissions:
  contents: read

on: [pull_request]

env:
  CLICOLOR: 1

jobs:
  Audit:
    name: Run UV Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v5
    - name: Run UV Audit
      uses: ./.github/workflows/run_check_matrix.yml
      with:
        command_name: "UV Audit"
        command: "uv audit --no-dev"

