[project]
name = "tkr-substitution-worker-impl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.7",
    "pytket>=2.9.3",
    "tierkreis",
    "ruff",
    "tkr-substitution-worker",
]

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-substitution-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-substitution-worker = "src.main:main"
