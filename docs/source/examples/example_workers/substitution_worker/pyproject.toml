[project]
name = "substitution-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.7",
    "pytket>=2.9.3",
    "tierkreis",
		"ruff",
    "substitution-worker-api",
]

[tool.uv.sources]
tierkreis = { path = "../../../../../tierkreis", editable = true }
substitution-worker-api = { workspace = true }

[tool.uv.workspace]
members = [
    "src/api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-substitution-worker = "src.main:main"
