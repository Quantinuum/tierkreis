[project]
name = "tkr-scipy-worker-impl"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.16.3",
    "tierkreis>=2.0.10",
    "ruff",
    "tkr-scipy-worker",
]

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-scipy-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-scipy-worker = "src.main:main"
