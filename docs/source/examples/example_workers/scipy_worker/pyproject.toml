[project]
name = "scipy-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.16.3",
    "tierkreis>=2.0.10",
    "ruff",
    "scipy-worker-api",
]

[tool.uv.sources]
tierkreis = { path = "../../../../../tierkreis", editable = true }
scipy-worker-api = { workspace = true }

[tool.uv.workspace]
members = [
    "src/api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-scipy-worker = "src.main:main"
