[project]
name = "tkr-scipy-worker"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
]

[tool.uv.sources]
tierkreis = { path = "../../../../../../tierkreis", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"api.py" = "scipy_worker.py"
