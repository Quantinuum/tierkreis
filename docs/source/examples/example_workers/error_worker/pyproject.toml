[project]
name = "error-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic", "tierkreis", "ruff", "error-worker-api"]

[tool.uv.sources]
tierkreis = { workspace = true }
error-worker-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-error-worker = "src.main:main"
