[project]
name = "tkr-auth-worker-impl"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.7",
    "pydantic>=2.11.7",
    "pyscrypt>=1.6.2",
    "tierkreis",
    "tkr-auth-worker",
]

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-auth-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-auth-worker-impl = "src.main:main"

