[project]
name = "auth-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.7",
    "pydantic>=2.11.7",
    "pyscrypt>=1.6.2",
    "tierkreis",
    "auth-worker-api",
]

[tool.uv.sources]
tierkreis = { workspace = true }
auth-worker-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-auth-worker = "src.main:main"
