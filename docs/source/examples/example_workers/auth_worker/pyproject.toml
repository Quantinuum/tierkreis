[project]
name = "tkr-auth-worker-impl"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.7",
    "pydantic>=2.11.7",
    "pyscrypt>=1.6.2",
    "tierkreis",
    "tkr-auth-worker",
]

[tool.uv.sources]
tkr-auth-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
tkr-auth-worker = "tkr_auth_worker_impl.main:main"

