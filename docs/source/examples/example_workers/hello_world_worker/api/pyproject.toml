[project]
name = "tkr-hello-world-worker"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
]

[tool.uv.sources]
tierkreis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"api.py" = "hello_world_worker.py"
