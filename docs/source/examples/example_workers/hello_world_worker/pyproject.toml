[project]
name = "hello-world-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tierkreis", "ruff", "hello-world-worker-api"]

[tool.uv.sources]
tierkreis = { path = "../../../../../tierkreis", editable = true }
hello-world-worker-api = { workspace = true }

[tool.uv.workspace]
members = [
    "src/api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-hello-world-worker = "src.main:main"
