[project]
name = "tkr-qsci-worker-impl"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.9",
    "pytket>=2.18.1",
    "pytket-qiskit>=0.71.0",
    "qiskit-ibm-runtime>=0.41.1",
    "tierkreis",
    "ruff",
    "pyscf",
    "tkr-qsci-worker",
]

[tool.uv.sources]
tkr-qsci-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[project.scripts]
tkr-qsci-worker = "tkr_qsci_worker_impl.main:main"
