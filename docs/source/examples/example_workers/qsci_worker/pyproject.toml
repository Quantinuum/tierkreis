[project]
name = "tkr-qsci-worker-impl"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.9",
    "pytket>=2.9.3",
    "pytket-qiskit>=0.71.0",
    "qiskit-ibm-runtime>=0.41.1",
    "tierkreis",
    "ruff",
    "pyscf",
    "tkr-qsci-worker",
]

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-qsci-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
tkr-qsci-worker-impl = "src.main:main"
