[project]
name = "openssl-worker-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
]

[tool.uv.sources]
tierkreis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"stubs.py" = "openssl_worker.py"
