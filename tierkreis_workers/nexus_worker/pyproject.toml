[project]
name = "tkr-nexus-worker-impl"
version = "0.2.0"
description = "A Tierkreis worker for interacting with Nexus."
authors = [ {name = "Quantinuum Tierkreis Team"} ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
    "qnexus==0.37.1",
    "tkr-nexus-worker"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "*.py",
]
[tool.hatch.build.targets.wheel]
include = [
  "*.py",
]

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-nexus-worker = { workspace = true }

[project.scripts]
tkr-nexus-worker-impl = "src.main:main"
