[project]
name = "tkr-pytket-worker-impl"
version = "0.2.0"
description = "A Tierkreis worker for pytket."
authors = [ {name = "Quantinuum Tierkreis Team"} ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
    "pytket",
    "qnexus",
    "pytket_qirpass",
    "tkr-pytket-worker"
]

[dependency-groups]
test = [
    "pytket-qiskit>=0.77.0",
    "pytket-quantinuum>=0.57.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "*.py",
]
[tool.hatch.build.targets.wheel]
include = [
  "*.py",
]

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-pytket-worker = { workspace = true }

[project.scripts]
tkr-pytket-worker-impl = "src.main:main"
