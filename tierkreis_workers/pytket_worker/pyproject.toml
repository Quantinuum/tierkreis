[project]
name = "tkr-pytket-worker-impl"
version = "0.3.0"
description = "A Tierkreis worker for pytket."
authors = [ {name = "Quantinuum Tierkreis Team"} ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis>=3.0.0",
    "pytket",
    "qnexus",
    "pytket_qirpass",
    "tkr-pytket-worker"
]

[dependency-groups]
test = [
    "pytket-qiskit>=0.79.0",
    "pytket-quantinuum>=0.59.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
tkr-pytket-worker = { workspace = true }

[project.scripts]
tkr-pytket-worker = "tkr_pytket_worker_impl.main:main"
