[project]
name = "tkr-guppy-worker"
version = "0.2.1"
description = "The api for the Tierkreis guppy worker."
requires-python = ">=3.12"
authors = [ {name = "Quantinuum Tierkreis Team"} ]
dependencies = [
    "tierkreis",
]

[tool.uv.sources]
tierkreis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"api.py" = "guppy_worker.py"
