[project]
name = "tkr-gpu-worker-impl"
version = "0.2.1"
description = "A Tierkreis worker for GPUs."
authors = [ {name = "Quantinuum Tierkreis Team"} ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
    "tkr-gpu-worker",
    "torch",
    "torchvision"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tkr-gpu-worker = { workspace = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[project.scripts]
tkr-gpu-worker = "tkr_gpu_worker_impl.main:main"
