[project]
name = "tkr-aer-worker-impl"
version = "0.2.0"
description = "A Tierkreis worker for Aer."
authors = [ {name = "Quantinuum Tierkreis Team"} ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
    "pytket-qiskit",
    "tkr-aer-worker"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-aer-worker = { workspace = true }

[project.scripts]
tkr-aer-worker-impl = "src.main:main"
