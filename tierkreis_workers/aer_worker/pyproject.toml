[project]
name = "tkr-aer-worker-impl"
version = "0.3.0"
description = "A Tierkreis worker for Aer."
authors = [ {name = "Quantinuum Tierkreis Team"} ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis>=3.0.0",
    "pytket-qiskit[aer]",
    "tkr-aer-worker"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tkr-aer-worker = { workspace = true }

[project.scripts]
tkr-aer-worker = "tkr_aer_worker_impl.main:main"
