[project]
name = "tkr-quantinuum-worker-impl"
version = "0.2.0"
description = "A Tierkreis worker for compilation of quanitnuum backends."
authors = [ {name = "Quantinuum Tierkreis Team"} ]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytket-quantinuum>=0.57.0",
    "qnexus==0.37.1",
    "tierkreis",
    "tkr-quantinuum-worker"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "*.py",
]
[tool.hatch.build.targets.wheel]
include = [
  "*.py",
]

[tool.uv.sources]
tierkreis = { workspace = true }
tkr-quantinuum-worker = { workspace = true }

[project.scripts]
tkr-quantinuum-worker-impl = "src.main:main"
