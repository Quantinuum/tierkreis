[project]
name = "tkr-quantinuum-worker"
version = "0.2.1"
description = "The api for the Tierkreis quantinuum worker."
requires-python = ">=3.12"
authors = [ {name = "Quantinuum Tierkreis Team"} ]
dependencies = [
    "tierkreis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"api.py" = "quantinuum_worker.py"
