[package]
name = "tierkreis"
version = "0.1.0"
edition = "2024"

[lib]

[[bin]]
name = "tkr"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "http2"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter"] }
pyo3 = { version = "0.28.2", features = ["auto-initialize", "anyhow"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["net", "rt-multi-thread"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "debug", "uuid", "chrono"] }
utoipa-axum = { version = "0.2.0", features = ["debug"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.23.0", features = ["serde"] }
