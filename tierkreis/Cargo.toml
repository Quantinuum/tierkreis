[package]
name = "tierkreis"
description = "The Tierkreis Scientific Workflow Management System."
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Quantinuum/tierkreis"
documentation = "https://quantinuum.github.io/tierkreis/"

[lib]
crate-type = ["rlib", "cdylib"]

# Disabled until feature-parity with the existing CLI tool.
# [[bin]]
# name = "tkr"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "http2"] }
axum-extra = { version = "0.12.6", features = ["query"] }
bitvec = { version = "1.0.1", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
dashmap = "6.1.0"
deadpool = { version = "0.13.0", features = ["rt_tokio_1"] }
diesel = { version = "2.3.10", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel-async = { version = "0.8.0", features = ["deadpool", "migrations", "sqlite"] }
diesel_migrations = "2.3.2"
futures = "0.3.32"
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter"] }
num-complex = { version = "0.4", features = ["serde"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "gzip-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
portgraph = { version = "0.16.1", features = ["serde"] }
pyo3 = { version = "0.29.0", features = ["abi3", "abi3t", "num-complex"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_plain = "1.0.2"
serde_json = "1.0.149"
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["net", "fs", "process", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
utoipa = { version = "5.4.0", features = ["axum_extras", "debug", "uuid", "chrono"] }
utoipa-axum = { version = "0.2.0", features = ["debug"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
which = { version = "8.0.2", features = ["regex"] }
reqwest = { version = "0.13.4", features = ["cookies", "gzip", "json", "query"] }
serde_with = { version = "3.21.0", features = ["base64"] }
hugr = "0.27.2"
reqwest-websocket = { version = "0.6.0", features = ["json"] }
rand = "0.10.2"
toml = "1.1.4"

[dev-dependencies]
axum-test = { version = "21.0.0", features = ["ws"] }
mockito = "1.7.2"
rstest = "0.26.1"
test-log = { version = "0.2.21", features = ["trace"] }
