[package]
name = "tierkreis"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tkr"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "http2"] }
bitvec = { version = "1.0.1", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
dashmap = "6.1.0"
deadpool = { version = "0.13.0", features = ["rt_tokio_1"] }
diesel = { version = "2.3.10", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel-async = { version = "0.8.0", features = ["deadpool", "migrations", "sqlite"] }
diesel_migrations = "2.3.2"
futures = "0.3.32"
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter"] }
num-complex = { version = "0.4", features = ["serde"] }
portgraph = { version = "0.16.1", features = ["serde"] }
pyo3 = { version = "0.29.0", features = ["auto-initialize", "anyhow", "abi3", "num-complex"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["net", "process", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
url = "2.5.8"
utoipa = { version = "5.4.0", features = ["axum_extras", "debug", "uuid", "chrono"] }
utoipa-axum = { version = "0.2.0", features = ["debug"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.23.0", features = ["serde", "v7"] }
which = { version = "8.0.2", features = ["regex"] }

[dev-dependencies]
rstest = "0.26.1"
test-log = { version = "0.2.21", features = ["trace"] }
