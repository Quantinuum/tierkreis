default_storage_name = "file"
default_executor_name = "slurm"

[worker_commands.x86_64]
mpi_worker = ["uv", "run", "/mpi_worker/main.py"]

[asset_storage.file]
type = "File"
asset_dir = "$HOME/.tierkreis/assets"

[executors.slurm]
type = "Hpc"
hpc_storage_name = "file"
output_storage_name = "file"
scheduler = "slurm"
poll_interval_secs = 1
worker_architecture = "x86_64"

# max available resources
[executors.slurm.resources]
nodes = 2
cores_per_node = 1
gpus_per_node = 0

[executors.pbs]
type = "Hpc"
hpc_storage_name = "file"
output_storage_name = "file"
scheduler = "pbs"
poll_interval_secs = 1
worker_architecture = "x86_64"

[executors.pbs.resources]
nodes = 2
cores_per_node = 1
gpus_per_node = 0

[runtime_state]
type = "Memory"
