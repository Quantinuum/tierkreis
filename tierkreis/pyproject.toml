[project]
name = "tierkreis"
description = "Python client and utilities for tierkreis."
readme = "README.md"
version = "2.0.11"
authors = [
    { name = "Seyon Sivarajah", email = "seyon.sivarajah@quantinuum.com" },
    { name = "Lukas Heidemann", email = "lukas.heidemann@quantinuum.com" },
    { name = "John Children", email = "john.children@quantinuum.com" },
    { name = "Alan Lawrence", email = "alan.lawrence@quantinuum.com" },
    { name = "Matthew Burke", email = "matthew.burke@quantinuum.com" },
    { name = "Philipp Seitz", email = "philipp.seitz@quantinuum.com" },
]

requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest",
]
build = ["build[uv]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
extend-exclude = [
    # Ignore worker stubs:
    "*_worker.py",
    "stubs.py",
    "stubs_output.py",
    # Ignore docs
    "tierkreis/docs/*",
]
[tool.ruff.lint]
select = ["ALL"]
isort.known-first-party = ["tierkreis", "tierkreis_visualizer"]
pydocstyle.convention = "pep257"

# Ignore specific rules that might be redundant or annoying
ignore = [
    "D203", # Conflict: 1 blank line before class (D203) vs no blank lines (D211)
    "D213", # Conflict: Multi-line docstring summary start (D212) vs (D213)
    "ISC001", # Single line implicit string concatenation
    "S603", # Subprocess calls
    "D107", # In favor of documenting classes directly
]

[tool.ruff.lint.per-file-ignores]
"tierkreis/tests/*" = [
    "S101",    # asserts allowed in tests...
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "D",
]


[tool.pyright]
include = ["."]
exclude = []
ignore = []

[project.scripts]
tkr = "tierkreis.cli.tkr:main"
