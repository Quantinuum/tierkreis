[tool.uv.workspace]
members = [
    "tierkreis",
    "tierkreis_workers/*worker",
    "tierkreis_workers/*worker/api",
    "docs/source/examples/example_workers/*worker",
    "docs/source/examples/example_workers/*worker/api",
]
exclude = [
    "docs/source/examples/example_workers/openssl_worker",
]

[tool.ruff]
target-version = "py312"
# maturin does not output the correct type for __exit__ yet.
lint.ignore = ["PYI036"]
format.preview = true

[tool.uv]
exclude-newer = "P7D"
required-version = ">=0.13.1"

[tool.uv.sources]
tierkreis = { workspace = true }

[dependency-groups]
# Default dev dependency group
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
]
lint = [
    "isort>=9.0.2",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
]
test = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1,<1.5",
    "pytest-cov>=5.0,<8",
    "pytest-timeout>=2.4.0,<3",
    "pydantic>=2.14.2",
]
docs = [
    "sphinx>=8.2",
    "sphinx-autodoc2>=0.5.0",
    "myst-nb>=1.4.0",
    "furo>=2025.7.19",
    "pyscf>=2.13.1",
    "sphinx-copybutton>=0.5.2"
]
