[tool.uv.workspace]
members = [
    "tierkreis",
    "tierkreis_visualization",
    "tierkreis_workers/*worker",
    "tierkreis_workers/*worker/api",
    "docs/source/examples/example_workers/*worker",
    "docs/source/examples/example_workers/*worker/api",
]
exclude = [
    "docs/source/examples/example_workers/openssl_worker",
]

[tool.uv]
exclude-newer = "7 days"


[dependency-groups]
# Default dev dependency group
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
]
lint = [
    "isort>=6.0.1",
    "ruff>=0.15.11",
    "pyright>=1.1.400",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.16,<1.4",
    "pytest-cov>=5.0,<8",
    "pydantic>=2.13.2",
]
docs = [
    "sphinx>=8.2",
    "sphinx-autodoc2>=0.5.0",
    "myst-nb>=1.4.0",
    "furo>=2025.7.19",
    "pyscf>=2.9.0",
]
