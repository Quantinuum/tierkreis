[tool.uv.workspace]
members = [
    "tierkreis",
    "tierkreis_visualization",
    "tierkreis_workers/*worker",
]


[dependency-groups]
# Default dev dependency group
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
]
lint = [
    "isort>=6.0.1",
    "ruff>=0.12.5",
    "pyright>=1.1.400",
]
test = [
    "pytest>=6.2,<10",
    "pytest-asyncio>=0.16,<0.17",
    "pytest-cov>=5.0,<8",
    "pydantic>=2.9.2",
]
docs = [
    "sphinx>=8.2",
    "myst-parser>=4.0.1",
    "sphinx-autodoc2>=0.5.0",
    "myst-nb>=1.3.0",
    "furo>=2025.7.19",
]
